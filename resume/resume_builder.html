<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlQuraTech - AI Resume Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .resume-preview {
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
        }
        
        .resume-preview:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .template-card {
            position: relative;
            overflow: hidden;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .template-card:hover {
            transform: scale(1.02);
        }
        
        .template-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .template-card:hover::before {
            opacity: 1;
        }
        
        .skill-badge {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }
        
        .skill-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        
        .experience-card {
            position: relative;
            padding-left: 2rem;
            margin-bottom: 2rem;
        }
        
        .experience-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, #4f46e5, #7c3aed);
        }
        
        .experience-card::after {
            content: '';
            position: absolute;
            left: -4px;
            top: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4f46e5;
        }
        
        .ai-suggestion {
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <!-- Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold text-white">AlQuraTech</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/roadmap" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">
                        <i class="fas fa-map mr-2"></i>Roadmap
                    </a>
                    <a href="/resume" class="text-white bg-indigo-600 px-3 py-2 rounded-md text-sm font-medium">
                        <i class="fas fa-file-alt mr-2"></i>Resume Builder
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Resume Form -->
            <div class="space-y-8">
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-2xl font-bold mb-6">Personal Information</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Full Name</label>
                            <input type="text" id="fullName" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                            <input type="email" id="email" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Phone</label>
                            <input type="tel" id="phone" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Location</label>
                            <input type="text" id="location" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-2xl font-bold mb-6">Professional Summary</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Summary</label>
                            <textarea id="summary" rows="4" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent"></textarea>
                        </div>
                        <button onclick="generateAISummary()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors">
                            <i class="fas fa-magic mr-2"></i>Generate AI Summary
                        </button>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-2xl font-bold mb-6">Skills</h2>
                    <div class="space-y-4">
                        <div id="skillTags" class="flex flex-wrap gap-2"></div>
                        <div class="flex gap-2">
                            <input type="text" id="skillInput" placeholder="Add a skill" class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                            <button onclick="addSkill()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                        <button onclick="generateAISkills()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors">
                            <i class="fas fa-magic mr-2"></i>Generate AI Skills
                        </button>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-2xl font-bold mb-6">Experience</h2>
                    <div id="experienceList" class="space-y-4"></div>
                    <button onclick="addExperience()" class="mt-4 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors">
                        <i class="fas fa-plus mr-2"></i>Add Experience
                    </button>
                </div>

                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-2xl font-bold mb-6">Education</h2>
                    <div id="educationList" class="space-y-4"></div>
                    <button onclick="addEducation()" class="mt-4 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors">
                        <i class="fas fa-plus mr-2"></i>Add Education
                    </button>
                </div>
            </div>

            <!-- Resume Preview -->
            <div class="space-y-8">
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-2xl font-bold mb-6">Resume Preview</h2>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <div class="flex space-x-4">
                                <button onclick="changeTemplate('modern')" class="bg-gray-700 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition-colors">
                                    Modern
                                </button>
                                <button onclick="changeTemplate('classic')" class="bg-gray-700 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition-colors">
                                    Classic
                                </button>
                                <button onclick="changeTemplate('minimal')" class="bg-gray-700 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition-colors">
                                    Minimal
                                </button>
                            </div>
                            <button onclick="exportResume()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-colors">
                                <i class="fas fa-download mr-2"></i>Export
                            </button>
                        </div>
                        <div id="resumePreview" class="resume-preview bg-white p-8 rounded-lg">
                            <!-- Resume content will be dynamically inserted here -->
                        </div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-2xl font-bold mb-6">AI Suggestions</h2>
                    <div id="aiSuggestions" class="space-y-4">
                        <!-- AI suggestions will be dynamically inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- AI Chat Interface -->
    <div class="fixed bottom-4 right-4 w-96 bg-gray-800 rounded-lg shadow-lg border border-gray-700">
        <div class="p-4 border-b border-gray-700">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-semibold">AI Resume Assistant</h3>
                <button onclick="toggleChat()" class="text-gray-400 hover:text-white">
                    <i class="fas fa-minus"></i>
                </button>
            </div>
        </div>
        <div id="chatMessages" class="h-64 overflow-y-auto p-4 space-y-4">
            <div class="message ai">
                <div class="flex items-start space-x-2">
                    <i class="fas fa-robot text-indigo-500 mt-1"></i>
                    <div>
                        <p>Hello! I'm your AI Resume Assistant. I can help you create a professional resume. What would you like to work on first?</p>
                        <div class="mt-2 flex flex-wrap gap-2">
                            <button onclick="suggestSummary()" class="bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full text-sm hover:bg-indigo-500/30 transition-colors">
                                Professional Summary
                            </button>
                            <button onclick="suggestSkills()" class="bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full text-sm hover:bg-indigo-500/30 transition-colors">
                                Skills
                            </button>
                            <button onclick="suggestExperience()" class="bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full text-sm hover:bg-indigo-500/30 transition-colors">
                                Experience
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="p-4 border-t border-gray-700">
            <div class="flex space-x-2">
                <input type="text" id="chatInput" placeholder="Ask for help..." class="flex-1 bg-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="sendMessage()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="resume_builder.js"></script>
</body>
</html>
